<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular seu Frete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container py-4">
        <form id="form-frete" class="p-4 bg-white shadow-sm rounded">
            <div class="mb-4 text-center">
                <h4 class="fw-bold">Dados do Produto</h4>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-md-4">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite o nome">
                </div>
                <div class="col-12 col-md-4">
                    <label for="sobrenome" class="form-label">Sobrenome</label>
                    <input type="text" class="form-control" id="sobrenome" placeholder="Digite o sobrenome">
                </div>
                <div class="col-12 col-md-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite o email">
                </div>
            </div>

            <hr>

            <div class="mb-4 text-center">
                <h4 class="fw-bold">Dados de Envio</h4>
            </div>

            <div class="row g-3 mb-4 align-items-end">
                <div class="col-12 col-sm-6 col-md-4 d-flex">
                    <input type="text" class="form-control me-2" id="cep" placeholder="Digite o CEP">
                    <button type="button" class="btn btn-primary" id="buscar-cep">
                        <i class="bi bi-search"></i>
                        <span class="d-none spinner-border spinner-border-sm"></span>
                    </button>
                </div>
                <div class="col-12 col-md-6">
                    <input type="text" class="form-control" id="endereco" placeholder="Digite o endereço">
                </div>
                <div class="col-12 col-md-2">
                    <input type="text" class="form-control" id="numero" placeholder="Nº">
                </div>
            </div>

            <div class="d-grid d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-success w-100 w-md-auto">Calcular Frete</button>
            </div>
        </form>
    </div>

    <script src="jquery.js"></script>
    <script src="jquery.mask.min.js"></script>
    <script src="main.js"></script>
    
</body>

</html>
